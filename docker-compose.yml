# Labo local : docker compose up
# L'API n'est exposée que sur la machine locale (127.0.0.1), jamais sur le réseau.
name: kabyle-lab

services:
  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/var/lab.db
      TESTSET_DIR: /repo-data/test
      TRAIN_DIR: /repo-data/train/processed
      RESULTS_DIR: /repo-data/results/public
      PROMPTS_FILE: /repo-data/prompts/guided_fr.yaml
      # Ollama tourne sur la machine hôte (Windows), joignable depuis le conteneur
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_URL:-http://host.docker.internal:11434}
      # Les notifications de fichiers ne traversent pas les volumes Windows : on scrute
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend/var:/app/var # base SQLite (ignorée par Git)
      - ./data:/repo-data # jeu de test versionné
      - ./backend/app:/app/app # code monté pour le rechargement à chaud
      - ./backend/tests:/app/tests
      - ./backend/config:/app/config # modèles (models.yaml)
      - ./backend/migrations:/app/migrations # migrations du schéma
      - ./pipelines:/app/pipelines # pipelines de données (phase 2)
      - ./scripts:/app/scripts # visuels de partage
    ports:
      - "127.0.0.1:${LAB_PORT:-8800}:8000"
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --reload

  lab-ui:
    image: node:22-alpine
    working_dir: /app
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_POLLING: "1"
    volumes:
      - ./lab-ui:/app
      - lab-ui-node-modules:/app/node_modules # dépendances dans un volume Docker (plus rapide sous Windows)
    ports:
      - "127.0.0.1:${LAB_UI_PORT:-5173}:5173"
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

  # Modèles locaux dans Docker (optionnel) : docker compose --profile ollama up -d
  # Alternative : Ollama installé sur Windows (joignable via host.docker.internal).
  # Image « latest » assumée : les nouveaux modèles exigent une version récente d'Ollama.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

volumes:
  lab-ui-node-modules:
  ollama-models:
