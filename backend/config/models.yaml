# Modèles disponibles dans le labo.
#
# Chaque entrée devient une ligne du classement. Une « variante » (few-shot, RAG, fine-tuné)
# est un modèle comme un autre, rattaché à son modèle de base par `base`, ce qui permet de
# calculer automatiquement le gain avant/après.
#
# `params` est transmis tel quel au fournisseur (noms de paramètres propres à chaque API) et
# enregistré avec chaque réponse. Principe : température 0 partout où l'API l'accepte.
# Exception documentée : les modèles Claude actuels n'acceptent plus `temperature`.
# Qwen3.5 : raisonnement désactivé (think: false) pour une réponse directe, comme les autres.
#
# `pricing` : prix en USD par million de tokens (entrée, sortie), pour estimer et plafonner
# les coûts. Laisser null si inconnu : le coût ne sera alors pas estimé (jamais inventé).
# Vérifier les prix sur le site de chaque fournisseur avant un gros run.

models:
  # ── Anthropic ──────────────────────────────────────────────
  - key: claude-opus-5-5
    label: Claude Opus 5.5
    provider: anthropic
    model: claude-opus-5-5
    params: { max_tokens: 4096, effort: medium }
    pricing: { input: 4.0, output: 20.0 }

  - key: claude-sonnet-5-5
    label: Claude Sonnet 5.5
    provider: anthropic
    model: claude-sonnet-5-5
    params: { max_tokens: 4096, effort: medium }
    pricing: { input: 2.0, output: 10.0 }

  - key: claude-haiku-5-5
    label: Claude Haiku 5.5
    provider: anthropic
    model: claude-haiku-5-5
    params: { max_tokens: 4096, effort: medium }
    pricing: { input: 0.1, output: 0.5 }

  # ── OpenAI (identifiants et prix vérifiés le 2026-10-29 sur developers.openai.com) ──
  - key: gpt-6-astra
    label: GPT-6 Astra
    provider: openai
    model: gpt-6-astra
    params: { max_completion_tokens: 4096 }
    pricing: { input: 10.0, output: 50.0 }

  - key: gpt-6.1-sol
    label: GPT-6.1 Sol
    provider: openai
    model: gpt-6.1-sol
    params: { max_completion_tokens: 4096 }
    pricing: { input: 2.0, output: 10.0 }

  - key: gpt-6-luna
    label: GPT-6 Luna
    provider: openai
    model: gpt-6-luna
    params: { max_completion_tokens: 4096 }
    pricing: { input: 0.1, output: 0.5 }

  # ── Mistral (alias « latest » maintenus par Mistral ; prix Large vérifié le 2026-10-29
  #    sur mistral.ai/pricing, prix Small non affiché : laissé à null) ───────
  #    public_only : le plan gratuit « Experiment » peut réutiliser les requêtes. Avec un
  #    plan payant qui ne le fait pas, passer public_only à false.
  - key: mistral-large
    label: Mistral Large
    provider: mistral
    model: mistral-large-latest
    params: { max_tokens: 2048, temperature: 0 }
    pricing: { input: 0.5, output: 1.5 }
    public_only: true

  # Mistral Large 4 : accessible avec la formule gratuite (vérifié le 2026-11-07, contrairement
  # à mistral-large-latest). Modèle à raisonnement : effort « low » (valeur la plus basse
  # acceptée, « none » est refusé) ; température 0 impose top_p 1 ; seule la réponse finale
  # est gardée (blocs « thinking » écartés).
  - key: mistral-large-4
    label: Mistral Large 4
    provider: mistral
    model: mistral-large-4
    params: { max_tokens: 4096, temperature: 0, top_p: 1, reasoning_effort: low }
    pricing: null
    public_only: true

  # Mêmes aides que pour Qwen et Gemini Flash-Lite (mêmes exemples, même index RAG).
  - key: mistral-large-4-fewshot
    label: Mistral Large 4 + few-shot
    provider: mistral
    model: mistral-large-4
    base: mistral-large-4
    variant: fewshot
    variant_params: { k: 5, selection: similar }
    params: { max_tokens: 4096, temperature: 0, top_p: 1, reasoning_effort: low }
    pricing: null
    public_only: true

  - key: mistral-large-4-rag
    label: Mistral Large 4 + RAG
    provider: mistral
    model: mistral-large-4
    base: mistral-large-4
    variant: rag
    variant_params: { k: 8 }
    params: { max_tokens: 4096, temperature: 0, top_p: 1, reasoning_effort: low }
    pricing: null
    public_only: true

  - key: mistral-small
    label: Mistral Small
    provider: mistral
    model: mistral-small-latest
    params: { max_tokens: 2048, temperature: 0 }
    pricing: null
    public_only: true

  # ── Google Gemini (clé gratuite sur aistudio.google.com) ─────────────
  # Alias « latest » maintenus par Google. Le plan gratuit peut réutiliser les requêtes :
  # tests publics seulement. Flash-Lite est le plus sûr d'être inclus dans le plan gratuit.
  - key: gemini-flash
    label: Gemini Flash
    provider: gemini
    model: gemini-flash-latest
    params: { max_tokens: 2048, temperature: 0 }
    pricing: { input: 0, output: 0 }
    public_only: true

  - key: gemini-flash-lite
    label: Gemini Flash-Lite
    provider: gemini
    model: gemini-flash-lite-latest
    params: { max_tokens: 2048, temperature: 0 }
    pricing: { input: 0, output: 0 }
    public_only: true

  # Bonus : un grand modèle avec les mêmes exemples few-shot que Qwen (paires Tatoeba
  # décontaminées, sélection par n-grammes, sans appel à Ollama). Mesure ce que gagne un
  # grand modèle avec la même aide que le petit.
  - key: gemini-flash-lite-fewshot
    label: Gemini Flash-Lite + few-shot
    provider: gemini
    model: gemini-flash-lite-latest
    base: gemini-flash-lite
    variant: fewshot
    variant_params: { k: 5, selection: similar }
    params: { max_tokens: 2048, temperature: 0 }
    pricing: { input: 0, output: 0 }
    public_only: true

  # Bonus : le même grand modèle avec le même RAG que Qwen (index bge-m3, 8 passages).
  # Les vecteurs des questions sont calculés par Ollama (bge-m3), la réponse par Gemini.
  - key: gemini-flash-lite-rag
    label: Gemini Flash-Lite + RAG
    provider: gemini
    model: gemini-flash-lite-latest
    base: gemini-flash-lite
    variant: rag
    variant_params: { k: 8 }
    params: { max_tokens: 2048, temperature: 0 }
    pricing: { input: 0, output: 0 }
    public_only: true

  # Bonus : le meilleur modèle (Gemini Flash) avec les mêmes aides, pour voir s'il progresse
  # encore ou s'il est déjà au plafond.
  - key: gemini-flash-fewshot
    label: Gemini Flash + few-shot
    provider: gemini
    model: gemini-flash-latest
    base: gemini-flash
    variant: fewshot
    variant_params: { k: 5, selection: similar }
    params: { max_tokens: 2048, temperature: 0 }
    pricing: { input: 0, output: 0 }
    public_only: true

  - key: gemini-flash-rag
    label: Gemini Flash + RAG
    provider: gemini
    model: gemini-flash-latest
    base: gemini-flash
    variant: rag
    variant_params: { k: 8 }
    params: { max_tokens: 2048, temperature: 0 }
    pricing: { input: 0, output: 0 }
    public_only: true

  # ── OpenRouter : modèles gratuits (suffixe :free, liste vérifiée le 2026-10-31 sur
  #    openrouter.ai/api/v1/models ; elle change souvent). Requêtes potentiellement
  #    réutilisées par les hébergeurs : tests publics seulement. ──
  - key: gemma4-31b-free
    label: Gemma 4 31B (gratuit)
    provider: openrouter
    model: google/gemma-4-31b-it:free
    params: { max_tokens: 2048, temperature: 0 }
    pricing: { input: 0, output: 0 }
    public_only: true

  - key: nemotron3-ultra-free
    label: Nemotron 3 Ultra 550B (gratuit)
    provider: openrouter
    model: nvidia/nemotron-3-ultra-550b-a55b:free
    params: { max_tokens: 2048, temperature: 0 }
    pricing: { input: 0, output: 0 }
    public_only: true

  - key: inkling-free
    label: Inkling (gratuit)
    provider: openrouter
    model: thinkingmachines/inkling:free
    params: { max_tokens: 2048, temperature: 0 }
    pricing: { input: 0, output: 0 }
    public_only: true

  # ── Petits modèles open source via Ollama (phase 2) ────────
  # Candidats (vérifiés le 2026-10-28, voir docs/phase2.md). Télécharger : ollama pull <model>
  # On mesure d'abord les trois modèles de base, puis on améliore le modèle retenu.
  - key: qwen3.5-4b
    label: Qwen3.5 4B
    provider: ollama
    model: qwen3.5:4b
    params: { temperature: 0, num_predict: 1024, think: false }
    pricing: { input: 0, output: 0 }

  - key: gemma4-e4b
    label: Gemma 4 E4B
    provider: ollama
    model: gemma4:e4b
    params: { temperature: 0, num_predict: 1024 }
    pricing: { input: 0, output: 0 }

  - key: apertus-8b
    label: Apertus 8B
    provider: ollama
    model: hf.co/unsloth/Apertus-8B-Instruct-2509-GGUF
    params: { temperature: 0, num_predict: 1024 }
    pricing: { input: 0, output: 0 }

  # Variantes du modèle retenu (Qwen3.5 4B par défaut : licence Apache 2.0, 4,7 Md de
  # paramètres, rapide sur un GPU T4 gratuit). Pour un autre modèle, dupliquer ces entrées.
  - key: qwen3.5-4b-fewshot
    label: Qwen3.5 4B + few-shot
    provider: ollama
    model: qwen3.5:4b
    base: qwen3.5-4b
    variant: fewshot
    variant_params: { k: 5, selection: similar }
    params: { temperature: 0, num_predict: 1024, think: false }
    pricing: { input: 0, output: 0 }

  - key: qwen3.5-4b-rag
    label: Qwen3.5 4B + RAG
    provider: ollama
    model: qwen3.5:4b
    base: qwen3.5-4b
    variant: rag
    variant_params: { k: 8 }
    params: { temperature: 0, num_predict: 1024, think: false }
    pricing: { input: 0, output: 0 }

  - key: qwen3.5-4b-lora
    label: Qwen3.5 4B fine-tuné (QLoRA)
    provider: ollama
    model: kab-qwen3.5-4b # créé par notebooks/ puis « ollama create »
    base: qwen3.5-4b
    variant: finetuned
    params: { temperature: 0, num_predict: 1024, think: false }
    pricing: { input: 0, output: 0 }

  # Second petit modèle amélioré : Ministral 3 8B (Mistral AI, Apache 2.0, ajouté le
  # 2026-11-07). Ollama ministral-3:8b = Q4_K_M, empreinte 1922accd5827. Mêmes aides et
  # même procédure de fine-tuning que Qwen (notebooks/01, MODEL_CHOICE = "ministral3-8b").
  - key: ministral3-8b
    label: Ministral 3 8B
    provider: ollama
    model: ministral-3:8b
    params: { temperature: 0, num_predict: 1024 }
    pricing: { input: 0, output: 0 }

  - key: ministral3-8b-fewshot
    label: Ministral 3 8B + few-shot
    provider: ollama
    model: ministral-3:8b
    base: ministral3-8b
    variant: fewshot
    variant_params: { k: 5, selection: similar }
    params: { temperature: 0, num_predict: 1024 }
    pricing: { input: 0, output: 0 }

  - key: ministral3-8b-rag
    label: Ministral 3 8B + RAG
    provider: ollama
    model: ministral-3:8b
    base: ministral3-8b
    variant: rag
    variant_params: { k: 8 }
    params: { temperature: 0, num_predict: 1024 }
    pricing: { input: 0, output: 0 }

  - key: ministral3-8b-lora
    label: Ministral 3 8B fine-tuné (QLoRA)
    provider: ollama
    model: kab-ministral3-8b # créé par le notebook 03 à partir du .gguf du notebook 01
    base: ministral3-8b
    variant: finetuned
    params: { temperature: 0, num_predict: 1024 }
    pricing: { input: 0, output: 0 }
