# Migrations du schéma de la base du labo.
# Appliquées automatiquement au démarrage de l'API (app/db.py).
# Nouvelle migration après modification des modèles :
#   docker compose run --rm api alembic revision --autogenerate -m "description"
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url = sqlite:///./var/lab.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
