name: CodeQL

# Analyse statique de sécurité du code (Python, TypeScript, workflows GitHub Actions).
# Les alertes apparaissent dans l'onglet Security du dépôt.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # chaque lundi : nouvelles règles de détection

permissions:
  contents: read

jobs:
  analyze:
    name: Analyse (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
