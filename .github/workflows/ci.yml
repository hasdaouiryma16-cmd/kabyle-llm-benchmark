name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Scan des secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tout l'historique : un secret supprimé reste dans les anciens commits
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Aucun fichier .env suivi par Git
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '\.env\.example$'; then
            echo "::error::Un fichier .env est suivi par Git."
            exit 1
          fi

  # Les jobs lint / tests / build (backend, lab-ui, site) et le contrôle de
  # contamination seront ajoutés au fil des étapes, dès que le code existe.
