# Hooks locaux exécutés avant chaque commit.
# Installation : pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.md$

  - repo: local
    hooks:
      - id: forbid-env-files
        name: Interdire les fichiers .env
        entry: Les fichiers .env ne doivent jamais être commités (seul .env.example est autorisé)
        language: fail
        files: (^|/)\.env(\..+)?$
        exclude: (^|/)\.env\.example$
